chor="start">antenna pocket, height: 4.50</text><text x="210.00" y="209.80" class="small" text-anchor="start">antenna pocket, top below the bar top: 0.95</text><text x="210.00" y="214.00" class="small" text-anchor="start">antenna pocket, depth from the inner face: 2.00</text><text x="210.00" y="218.20" class="small" text-anchor="start">outer skin at the pocket: 1.45</text><text x="210.00" y="222.40" class="small" text-anchor="start">pocket corner radius: 1.00</text><text x="24.00" y="236.00" class="head" text-anchor="start">HOLES: none. No thread.</text><text x="290.00" y="172.00" class="head" text-anchor="start">NOTES</text><text x="290.00" y="180.50" class="small"><tspan x="290.00" dy="0">Black POM (Delrin), as machined. No paint, no plating, no</tspan><tspan x="290.00" dy="3.2">metal of any kind: it is the radio window.</tspan></text><text x="290.00" y="189.00" class="small"><tspan x="290.00" dy="0">FIT: bar length 29.90 +0.00/-0.10. It slides into the 30.00</tspan><tspan x="290.00" dy="3.2">+0.10/0 slot of the bottom shell: play 0.10 to 0.30.</tspan></text><text x="290.00" y="197.50" class="small"><tspan x="290.00" dy="0">Keys: dia. 1.90 half-round on each end, centre 1.75 from the</tspan><tspan x="290.00" dy="3.2">outer face; the slot has dia. 2.00 reliefs.</tspan></text><text x="290.00" y="206.00" class="small"><tspan x="290.00" dy="0">Antenna pocket from the inner face, 14.20 long, corners</tspan><tspan x="290.00" dy="3.2">R1.00, outer skin 1.45. Machine as modelled.</tspan></text><text x="290.00" y="214.50" class="small"><tspan x="290.00" dy="0">Cosmetic face: the outer face, flush with the case wall. The</tspan><tspan x="290.00" dy="3.2">STEP is in the assembly frame.</tspan></text><text x="290.00" y="223.00" class="small"><tspan x="290.00" dy="0">General tolerance ISO 2768-m (a proposal, not a tested</tspan><tspan x="290.00" dy="3.2">requirement). Break edges 0.05 unless drawn.</tspan></text><text x="290.00" y="231.50" class="small"><tspan x="290.00" dy="0">Not ordered. Nothing has been milled. Check every fit on the</tspan><tspan x="290.00" dy="3.2">first article before the batch.</tspan></text></svg>
